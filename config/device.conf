# ============================================================
# LEAVR 执法记录仪 - 设备配置文件
# ============================================================

[System]
device_id = DEV001
police_id = 000001
language = zh_CN
timezone = Asia/Shanghai
ntp_server = ntp.aliyun.com
ntp_interval = 3600

[Record]
# 分辨率: 3840x2160 / 3072x2048 / 1920x1080 / 1280x720
resolution = 1920x1080
# 帧率: 20 / 30 / 60
fps = 30
# 编码: h264 / h265
codec = h265
# 主码流码率 (Kbps)
bitrate = 4096
# 子码流码率 (Kbps)
sub_bitrate = 512
# 预录时长 (秒): 0 / 5 / 10 / 15 / 30
pre_record_duration = 10
# 延录时长 (秒): 0 / 5 / 10 / 30
overrun_duration = 5
# 分段时长 (秒): 0=不分段 / 60 / 180 / 300 / 600
segment_duration = 300
# 定时录像开关
timed_record_enable = off
timed_start = 08:00
timed_duration = 60

[Photo]
# 分辨率
resolution = 8000x6000
# JPEG 质量 (70-100)
quality = 95
# 连拍张数: 1 / 3 / 5 / 10
burst_count = 3
# 照片时间戳水印
timestamp_stamp = on

[Audio]
# 录音格式: wav / mp3
record_format = wav
# 采样率: 8000 / 16000 / 48000
sample_rate = 48000
# MP3 码率 (Kbps, 仅MP3模式)
mp3_bitrate = 128
# MIC 增益 (0-100)
mic_gain = 80
# 扬声器音量 (0-100)
speaker_volume = 70

[EIS]
# 电子防抖开关
eis_enable = on
# 防抖强度: low / medium / high
eis_strength = medium
# 裁剪边距百分比
eis_crop_margin = 10

[Network]
# WiFi 模式: sta / ap / off
wifi_mode = sta
wifi_ssid = 
wifi_password = 
# RTMP 推流地址
rtmp_url = rtmp://server/live/stream
# RTSP 端口
rtsp_port = 554
# RTSP 最大并发客户端
rtsp_max_clients = 4
# RTSP 认证
rtsp_auth_enable = on
rtsp_username = admin
rtsp_password = 123456
# ONVIF 开关
onvif_enable = on
# GB28181 开关
gb28181_enable = on
gb28181_sip_id = 34020000001110000001
gb28181_sip_server = 192.168.1.100
gb28181_sip_port = 5060
gb28181_keepalive = 60
# 自动上传
auto_upload = off
upload_server = http://server/upload

[Infrared]
# 自动红外切换
auto_switch = on
# IR LED 亮度 (0-100)
ir_led_brightness = 80
# 夜视切换阈值 (ADC值)
night_threshold = 100
day_threshold = 150

[Security]
# 加密开关
encrypt_enable = on
# 加密算法: aes256_ctr / sm4_ctr
encrypt_algorithm = aes256_ctr
# 数字水印 (可选)
watermark_enable = off

[Storage]
# 循环覆盖
loop_record = on
# 保留空间 (MB)
reserved_space = 500

[Display]
# 屏幕亮度 (0-100)
brightness = 80
# 屏保超时 (秒)
screen_off_timeout = 30

[Power]
# 低电量告警阈值 (%)
low_battery_threshold = 15
# 临界电量关机阈值 (%)
critical_battery_threshold = 5
# 自动休眠倒计时 (秒), 0=不休眠
auto_sleep_timeout = 300
# 充电时允许录像
charge_record_enable = on

[LED]
# 录像指示灯模式: on / blink / off
record_led_mode = blink
# 充电指示灯模式
charging_led_mode = on

[Maintenance]
# 日志等级: debug / info / warn / error
log_level = info
# 日志最大大小 (MB)
log_max_size = 50
# OTA 升级服务器
ota_server = http://ota.server/firmware
# OTA 检查间隔 (秒)
ota_check_interval = 86400